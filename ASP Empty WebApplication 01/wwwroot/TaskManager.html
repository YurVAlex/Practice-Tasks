<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProTimeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles/project.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    </style>

</head>
<body>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <!-- TASK DESCRIPTION TOOLTIP (hidden by default) -->
    <div id="task-tooltip" class="hidden" role="tooltip" aria-hidden="true"></div>

    <!-- CONTEXT MENU -->
    <div id="context-menu" class="absolute w-40 bg-white rounded-lg shadow-xl py-1 z-[9999] hidden border border-gray-200" style="position: fixed;">
        <div class="px-3 py-2 text-xs font-semibold text-gray-500 border-b mb-1">Task Actions</div>
        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" onclick="handleContextMenuAction('Clone'); return false;">Clone</a>
        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" onclick="handleContextMenuAction('Edit'); return false;">Edit</a>
        <div class="border-t my-1"></div>
        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" onclick="handleContextMenuAction('Cut'); return false;">Cut</a>
        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" onclick="handleContextMenuAction('Copy'); return false;">Copy</a>
        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" onclick="handleContextMenuAction('Paste'); return false;">Paste</a>
        <div class="border-t my-1"></div>
        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" onclick="handleContextMenuAction('Delete'); return false;">Delete</a>
        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" onclick="handleContextMenuAction('Hide'); return false;">Hide</a>
    </div>

    <!-- PROJECT EDIT MENU MODAL -->
    <div id="project-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Manage Project</h2>
            <div id="project-modal-status" class="text-red-600 text-sm mb-3 font-medium"></div>
            <div class="space-y-4">
                <div>
                    <label for="project-modal-name" class="block text-sm font-medium text-gray-700">Project Name</label>
                    <input type="text" id="project-modal-name" placeholder="e.g., Q4 Launch Strategy" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex space-x-6">
                    <div class="flex items-center">
                        <input id="project-mode-current" name="project-mode" type="radio" value="current" checked class="h-4 w-4 text-primary-green border-gray-300 focus:ring-primary-green">
                        <label for="project-mode-current" class="ml-2 block text-sm font-medium text-gray-700">Current</label>
                    </div>
                    <div class="flex items-center">
                        <input id="project-mode-new" name="project-mode" type="radio" value="new" class="h-4 w-4 text-primary-green border-gray-300 focus:ring-primary-green">
                        <label for="project-mode-new" class="ml-2 block text-sm font-medium text-gray-700">New</label>
                    </div>
                </div>
                <div id="project-date-fields" class="flex space-x-4">
                    <div class="flex-1">
                        <label for="project-modal-start-date" class="block text-sm font-medium text-gray-700">Start Date</label>
                        <input type="date" id="project-modal-start-date" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div class="flex-1">
                        <label for="project-modal-end-date" class="block text-sm font-medium text-gray-700">End Date</label>
                        <input type="date" id="project-modal-end-date" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>
                <div id="project-description-field">
                    <label for="project-modal-description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="project-modal-description" rows="15" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button id="project-modal-cancel" class="px-4 py-2 text-sm font-semibold text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition duration-150">
                    Cancel
                </button>
                <button id="project-modal-ok" class="px-4 py-2 text-sm font-semibold bg-primary-green text-white rounded-lg shadow-md hover:bg-green-700 transition duration-150">
                    OK
                </button>
            </div>
        </div>
    </div>

    <!-- QUICK SCALE MODAL (compact, for clicking the progress line) -->
    <div id="scale-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md">
            <h2 class="text-lg font-bold mb-3 text-gray-800">Set Timeline Dates</h2>
            <div id="scale-modal-status" class="text-red-600 text-sm mb-3 font-medium"></div>
            <div class="flex space-x-4">
                <div class="flex-1">
                    <label for="scale-modal-start-date" class="block text-sm font-medium text-gray-700">Start Date</label>
                    <input type="date" id="scale-modal-start-date" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex-1">
                    <label for="scale-modal-end-date" class="block text-sm font-medium text-gray-700">End Date</label>
                    <input type="date" id="scale-modal-end-date" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button id="scale-modal-cancel" class="px-4 py-2 text-sm font-semibold text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition duration-150">
                    Cancel
                </button>
                <button id="scale-modal-ok" class="px-4 py-2 text-sm font-semibold bg-primary-green text-white rounded-lg shadow-md hover:bg-green-700 transition duration-150">
                    OK
                </button>
            </div>
        </div>
    </div>

    <!-- TASK NEW/EDIT MENU MODAL -->
    <div id="task-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Add New Task</h2>
            <div id="task-modal-status" class="text-red-600 text-sm mb-3 font-medium"></div>
            <div class="space-y-4">
                <div>
                    <label for="task-name" class="block text-sm font-medium text-gray-700">Task Name</label>
                    <input type="text" id="task-name" placeholder="e.g., Final Presentation Prep" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex space-x-4">
                    <div class="flex-1">
                        <label for="task-start-date" class="block text-sm font-medium text-gray-700">Start Date</label>
                        <input type="date" id="task-start-date" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div class="flex-1">
                        <label for="task-end-date" class="block text-sm font-medium text-gray-700">End Date</label>
                        <input type="date" id="task-end-date" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label for="task-description" class="block text-sm font-medium text-gray-700">Description (Optional)</label>
                    <textarea id="task-description" rows="15" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>

                <!-- Replaced "Completed" checkbox with radio + progress input -->
                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                        <input id="task-status-completed" name="task-status" type="radio" value="completed" class="h-4 w-4 text-secondary-green border-gray-300 focus:ring-secondary-green">
                        <label for="task-status-completed" class="ml-2 block text-sm font-medium text-gray-700">Completed</label>
                    </div>
                    <div class="flex items-center">
                        <input id="task-status-progress" name="task-status" type="radio" value="progress" class="h-4 w-4 text-secondary-green border-gray-300 focus:ring-secondary-green">
                        <label for="task-status-progress" class="ml-2 block text-sm font-medium text-gray-700">Progress</label>
                    </div>

                    <div class="ml-2">
                        <input id="task-progress" type="number" min="0" max="100" step="1" value="0"
                               class="w-20 p-1 border border-gray-300 rounded-md text-sm"
                               aria-label="Task progress percent" disabled>
                        <span class="ml-1 text-sm text-gray-600">%</span>
                    </div>
                </div>

            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button id="new-subproject" class="px-4 py-2 text-sm font-semibold text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition duration-150">
                    Subproject
                </button>
                <button id="cancel-task" class="px-4 py-2 text-sm font-semibold text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition duration-150">
                    Cancel
                </button>
                <button id="save-task-ok" data-task-id="" class="px-4 py-2 text-sm font-semibold bg-primary-green text-white rounded-lg shadow-md hover:bg-green-700 transition duration-150">
                    OK
                </button>
            </div>
        </div>
    </div>

    <!-- DELETE CONFIRMATION MODAL (in-page "Are you sure?" modal) -->
    <div id="delete-confirm-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center z-[99999] hidden p-4" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title" tabindex="-1">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md" id="delete-confirm-content">
            <h3 id="delete-confirm-title" class="text-lg font-bold text-gray-800 mb-2">Confirm Delete</h3>
            <p id="delete-confirm-message" class="text-sm text-gray-700 mb-4">Are you sure you want to delete this task?</p>
            <div class="flex justify-end space-x-3 mt-4">
                <button id="delete-confirm-cancel" type="button" class="px-4 py-2 text-sm font-semibold text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition duration-150">
                    Cancel
                </button>
                <button id="delete-confirm-ok" type="button" class="px-4 py-2 text-sm font-semibold bg-red-600 text-white rounded-lg shadow-md hover:bg-red-700 transition duration-150">
                    Delete
                </button>
            </div>
        </div>
    </div>


    <div class="w-full px-6 py-2 md:px-10 md:py-2">

        <!-- Project name panel -->
        <div class="text-2xl font-extrabold text-gray-800 mb-2">
            <span id="project-name-display" class="text-gray-800"></span>
        </div>

        <div class="w-full mt-2 p-3 md:p-1 bg-white rounded-xl shadow-2xl">

            <!-- Control panel -->
            <div class="flex items-center gap-2 mb-10 p-1 bg-gray-50 rounded-lg flex-wrap ">

                <button id="open-project-modal" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1">
                    <img src="PNG/Project.png" class="icon-img"> Project
                </button>

                <button id="open-task-modal" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1">
                    <img src="PNG/Add.png" class="icon-img"> Task
                </button>

                <button id="open-scale-modal" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1">
                    <img src="PNG/Scale.png" class="icon-img"> Scale
                </button>

                <button id="open-sort-modal" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-0.5">
                    <img src="PNG/Sort.png" class="icon-img"> Sort
                </button>

                <button id="open-notify-modal" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1"
                        onclick="showToast('This feature is still under development.', 'error');">
                    <img src="PNG/Notify.png" class="icon-img"> Notify
                </button>

                <button id="open-share-modal" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1"
                        onclick="showToast('This feature is still under development.', 'error');">
                    <img src="PNG/Share.png" class="icon-img"> Share
                </button>

                <button id="open-print-window" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1"
                        onclick="showToast('This feature is still under development.', 'error');">
                    <img src="PNG/Print.png" class="icon-img"> Print
                </button>

                <button id="open-personnel-modal" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1"
                        onclick="showToast('This feature is still under development.', 'error');">
                    <img src="PNG/Personnel.png" class="icon-img"> Staff
                </button>

                <!-- Flexible spacer pushes the Project button to the far right -->
                <div class="flex-1"></div>

                <button id="open-languages-modal" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1"
                        onclick="showToast('This feature is still under development.', 'error');">
                    <img src="PNG/Globe.png" class="icon-img">
                </button>

                <button id="open-question-modal" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1"
                        onclick="showToast('This feature is still under development.', 'error');">
                    <img src="PNG/Question.png" class="icon-img">
                </button>

                <button id="dark-mode" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1"
                        onclick="showToast('This feature is still under development.', 'error');">
                    <img src="PNG/Dark.png" class="icon-img">
                </button>

                <button id="open-user-chamber" class="px-2 py-2 bg-gray-300 text-black font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150 flex items-center gap-1"
                        onclick="showToast('This feature is still under development.', 'error');">
                    <img src="PNG/User.png" class="icon-img"> User
                </button>

            </div>

            <!-- Main timeline panel -->
            <div id="timeline-container" class="relative w-full min-h-[60vh] my-2">
                <div id="month-labels-container" class="absolute inset-x-0 h-3 flex items-center z-30" style="top: -30px;"></div>
                <div id="progress-line" class="absolute inset-x-0 top-5 h-3 bg-gray-200 rounded-full" style="cursor: pointer;"></div>
                <div id="progress-fill" class="absolute inset-x-0 top-5 h-3 bg-secondary-green rounded-full" style="width: 0%; cursor: pointer;"></div>

                <div id="today-marker" class="absolute top-0 transform -translate-x-1/2 flex flex-col items-center z-10" style="left: 0%;">
                    <span id="today-label" class="text-xs font-bold text-white bg-gray-600 py-0.2 px-2 rounded-full shadow-md whitespace-nowrap">Today: Date</span>
                </div>

                <div id="daily-ticks-container"></div>

                <div id="task-bars-container" class="absolute inset-x-0" style="top: 64px;"></div>

                <div class="absolute top-6 transform -translate-x-1/2 -translate-y-1/2 z-20" style="left: 0%;">
                    <div class="milestone-dot bg-secondary-green border-4 border-primary-green"></div>
                    <div id="start-marker-label" class="absolute top-5 left-9 transform -translate-x-1/2 w-28 text-center"></div>
                </div>

                <div class="absolute top-6 transform -translate-x-1/2 -translate-y-1/2 z-20" style="left: 100%;">
                    <div class="w-4 h-4 rounded-full bg-white border-4 border-gray-500"></div>
                    <div id="end-marker-label" class="absolute top-5 -left-6 transform -translate-x-1/2 w-28 text-center"></div>
                </div>

            </div>
        </div>

        <!-- Description panel-->
        <div class="w-full mt-3 p-4 md:p-3 bg-white rounded-xl shadow-xl border-t-4 border-gray-400">
            <h3 class="text-lg font-bold text-gray-800 mb-2">Project Description</h3>
            <p id="project-description-display" class="text-gray-600 italic"></p>
        </div>
    </div>

    <script src="Scripts/project.js"></script>
</body>

</html>
